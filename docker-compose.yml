# Production-like local stack: PostgreSQL 16 + MinIO (S3-compatible storage) + one-shot bucket init.
#
#   docker compose up -d            # db + minio (+ bucket created automatically)
#   docker compose down -v          # stop and delete all data
#
# Then in .env:  DATABASE_URL=postgres://atelier:atelier@localhost:5432/atelier
#                STORAGE_DRIVER=s3  (see the MinIO block in .env.example)
#
# Credentials below are for LOCAL DEVELOPMENT ONLY. Never reuse them in a deployed environment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier
      POSTGRES_DB: atelier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket and allows public READ of objects so GLB/texture URLs work in the browser.
  # Uploads still require credentials (presigned URLs issued by the admin API).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: atelier-assets
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set download local/$${MINIO_BUCKET} &&
      echo 'bucket ready: '$${MINIO_BUCKET}
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
